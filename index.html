
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Bordados Oliver</title>

  <!-- Ícono oficial de Oliver -->
  <link rel="apple-touch-icon"
        sizes="180x180"
        href="./Oliver_icono_180.png">

  <link rel="icon"
        type="image/png"
        href="./Oliver_icono_180.png">

  <meta name="theme-color" content="#BFE8F4">
  <meta name="apple-mobile-web-app-title"
        content="Bordados Oliver">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #EAF5FC;
      font-family: -apple-system,
        BlinkMacSystemFont, sans-serif;
      color: #315B78;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 35px 24px;
      background: #FFFFFF;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 8px 30px
        rgba(66, 124, 164, 0.12);
    }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 32px;
    }

    h1 {
      font-size: 26px;
      margin: 18px 0 9px;
    }

    p {
      color: #718EA3;
      line-height: 1.5;
      font-size: 15px;
    }

    .button {
      display: block;
      margin-top: 25px;
      padding: 17px 20px;
      border-radius: 14px;
      background: #548DB8;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
    }

    .small {
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="card">

    <img
      class="logo"
      src="./Oliver_icono_180.png"
      alt="Oliver"
    >

    <h1>Bordados Oliver 🐶</h1>

    <p>
      Tu taller organizado, siempre contigo.
    </p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbz-8sm1AvzL87-7ilz21VJQBZx-PIf2opx2ueVuJV7T98EYHiQMwGRmh7YzY1G36_FL/exec?vista=movil"
    >
      Abrir Oliver
    </a>

    <p class="small">
      Acceso exclusivo para cuentas autorizadas.
    </p>

  </main>
</body>
</html>
